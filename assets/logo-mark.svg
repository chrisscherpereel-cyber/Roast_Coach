<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Roast Coach">
  <defs>
    <linearGradient id="rc-badge" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#402417"/>
      <stop offset="1" stop-color="#1E0F09"/>
    </linearGradient>
    <linearGradient id="rc-ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E8622A"/>
      <stop offset="0.55" stop-color="#F79034"/>
      <stop offset="1" stop-color="#FFC15E"/>
    </linearGradient>
    <clipPath id="rc-bean">
      <ellipse cx="32" cy="32" rx="20.5" ry="15" transform="rotate(-30 32 32)"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#rc-badge)"/>

  <!-- the bean -->
  <ellipse cx="32" cy="32" rx="20.5" ry="15" transform="rotate(-30 32 32)" fill="#F7E9D7"/>

  <!-- its crease is the roast curve: a steep climb easing into the drop -->
  <g clip-path="url(#rc-bean)">
    <path d="M14.5 43.5 C 21 38.5, 25.5 30.5, 32.5 26.5 C 39 22.8, 44 21.8, 50 21.9"
          fill="none" stroke="url(#rc-ember)" stroke-width="4.4" stroke-linecap="round"/>
  </g>

  <!-- the drop -->
  <circle cx="45.6" cy="22.1" r="4.3" fill="#1E0F09"/>
  <circle cx="45.6" cy="22.1" r="2.6" fill="#FFC15E"/>
</svg>
