<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Roast Coach">
  <defs>
    <linearGradient id="rcf-ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E8622A"/>
      <stop offset="0.55" stop-color="#F79034"/>
      <stop offset="1" stop-color="#FFC15E"/>
    </linearGradient>
    <mask id="rcf-curve">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M 44 92 C 56 88 57 70 70 61 C 76 57 80 56 84 55"
            fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
      <circle cx="85" cy="55" r="5.5" fill="#000"/>
    </mask>
    <!-- Streamlit's theme is its own, not the system's, so the wordmark cannot
         switch on prefers-color-scheme. Ember carries both grounds instead. -->
    <linearGradient id="rcf-word" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="292" y2="0">
      <stop offset="0" stop-color="#E8622A"/>
      <stop offset="1" stop-color="#F79034"/>
    </linearGradient>
  </defs>

  <g transform="translate(2 2) scale(0.53)">
    <path d="M 64 14 C 86 40 100 52 100 74 A 36 36 0 0 1 28 74
             C 28 56 42 48 48 30 C 58 42 54 56 64 60 C 74 52 74 34 64 14 Z"
          fill="url(#rcf-ember)" mask="url(#rcf-curve)"/>
  </g>

  <text x="78" y="46" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.4" fill="url(#rcf-word)">Roast</text>
  <text x="165" y="46" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.4" fill="url(#rcf-word)">Coach</text>
</svg>
