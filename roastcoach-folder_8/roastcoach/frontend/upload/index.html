<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1f1a17; background: transparent;
  }
  @media (prefers-color-scheme: dark) { body { color: #efe9e3; } }

  .drop {
    border: 2px dashed rgba(232, 98, 42, .55); border-radius: 14px;
    padding: 24px 20px; text-align: center;
    background: rgba(232, 98, 42, .05); transition: background .15s, border-color .15s;
  }
  .drop:focus-visible { outline: none; }
  .drop.over { background: rgba(232, 98, 42, .18); border-color: #E8622A; }
  .drop .big { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .drop .small { font-size: 13px; opacity: .75; }
  .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .pick {
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    padding: 10px 20px; border-radius: 9px; border: 1px solid transparent;
    background: #E8622A; color: #fff;
  }
  .pick:hover { filter: brightness(1.07); }
  .pick:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .pick.quiet {
    background: transparent; border-color: rgba(128,110,100,.5); color: inherit;
    font-weight: 500;
  }
  .drophint { margin-top: 14px; opacity: .6; }
  .bar {
    height: 6px; border-radius: 99px; background: rgba(128,110,100,.25);
    overflow: hidden; margin-top: 12px;
  }
  .bar > i { display: block; height: 100%; background: #E8622A; width: 0; transition: width .2s; }
  .note { font-size: 13px; margin-top: 10px; opacity: .8; text-align: center; }
  .note b { font-weight: 600; opacity: 1; }
  .warn { color: #b4471f; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="drop" id="drop">
  <div class="big">Upload your roasts folder</div>
  <div class="small">every roast file inside it, in one go</div>
  <div class="buttons">
    <button type="button" id="pickFolder" class="pick">Choose folder…</button>
    <button type="button" id="pickFiles" class="pick quiet">Choose files…</button>
  </div>
  <div class="small drophint">or drag the folder here from Finder</div>
</div>
<input type="file" id="folderInput" webkitdirectory directory multiple>
<input type="file" id="fileInput" multiple>
<div class="bar" hidden id="barwrap"><i id="bar"></i></div>
<div class="note" id="note"></div>

<script>
const BATCH = 10;
const LIMIT = 5000;                 // a sane ceiling on one drop
const ROAST_HINTS = ["beanTemperature", "drumTemperature", "roastName", "beanDerivative"];

let args = {};
let queue = [];        // files still to read and send
let chosen = 0;
let alreadyHad = 0;
let sequence = 0;
let working = false;
let blockedHint = false;

const $ = (id) => document.getElementById(id);

/* --- Streamlit component protocol, without the npm package --- */
function send(value) {
  sequence += 1;
  window.parent.postMessage(
    { isStreamlitMessage: true, type: "streamlit:setComponentValue",
      value: { ...value, seq: sequence } }, "*");
}
function height() {
  window.parent.postMessage(
    { isStreamlitMessage: true, type: "streamlit:setFrameHeight",
      height: document.body.scrollHeight + 8 }, "*");
}
window.addEventListener("message", (event) => {
  if (event.data.type !== "streamlit:render") return;
  args = event.data.args || {};
  if (queue.length) pump();          // the app is ready for the next batch
  height();
});
window.parent.postMessage(
  { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");

/* --- a dropped folder, walked --------------------------------------------
   Dragging is not the folder picker and is not subject to its rules: a folder
   dragged out of Finder arrives as a directory entry that can simply be read.
   This is what lets a folder inside ~/Library work at all.                  */
function readEntries(reader) {
  return new Promise((resolve) => reader.readEntries(resolve, () => resolve([])));
}
function fileOf(entry) {
  return new Promise((resolve) => entry.file(resolve, () => resolve(null)));
}
async function walk(entry, found, depth) {
  if (!entry || found.length >= LIMIT) return;
  if (entry.isFile) {
    const file = await fileOf(entry);
    if (file) found.push(file);
    return;
  }
  if (entry.isDirectory && depth < 4) {
    const reader = entry.createReader();
    let batch = await readEntries(reader);
    while (batch.length) {                       // readEntries returns 100 at a time
      for (const child of batch) await walk(child, found, depth + 1);
      batch = await readEntries(reader);
    }
  }
}

/* --- what counts as new --- */
function isNew(file) {
  const previous = (args.known || {})[file.name];
  if (!previous) return true;
  const sameTime = Math.abs(previous[0] - file.lastModified / 1000) < 1;
  return !(sameTime && previous[1] === file.size);
}

function wanted(file) {
  const name = (file.name || "").toLowerCase();
  if (name.startsWith(".")) return false;
  // RoasTime writes every record with no extension at all — roasts, beans and
  // recipes alike — so an extension is never required, only disqualifying.
  if (!name.includes(".")) return true;
  return name.endsWith(".json") || name.endsWith(".csv") || name.endsWith(".txt");
}

/* A bean, recipe, container or profile file: RoasTime writes these with no
   extension at all, next to the roasts. They are small, so anything that parses
   as a JSON object with a name or an id is worth sending — the app decides what
   it is. Without this, dropping the whole roast-time folder sent the roasts and
   silently dropped everything that gives them their names. */
const COMPANION_LIMIT = 512 * 1024;

function looksLikeCompanion(text, size) {
  if (size > COMPANION_LIMIT) return false;
  const head = text.replace(/^\s+/, "").slice(0, 2000);
  if (!head.startsWith("{") && !head.startsWith("[")) return false;
  return /"(name|beanName|recipeName|nickname|title)"\s*:/.test(head)
      || /"(uid|guid|_id)"\s*:/.test(head);
}

function looksLikeRoast(text) {
  const head = text.slice(0, 4000);
  const trimmed = head.replace(/^\s+/, "");
  if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
    return ROAST_HINTS.some((hint) => head.includes(hint));
  }
  const lower = head.toLowerCase();
  return lower.includes("timeline") && (lower.includes("ibts") || lower.includes("bean probe"));
}

/* --- reading and sending --- */
function describe(extra, warn) {
  const parts = [];
  if (chosen) parts.push("<b>" + chosen + "</b> file" + (chosen === 1 ? "" : "s") + " picked up");
  if (alreadyHad) parts.push(alreadyHad + " already imported");
  if (extra) parts.push(extra);
  const text = parts.join(" · ");
  $("note").innerHTML = warn ? '<span class="warn">' + text + "</span>" : text;
  height();
}

async function pump() {
  if (working || !queue.length) return;
  working = true;
  const take = queue.splice(0, BATCH);
  const files = [];
  const others = [];
  const notRoasts = [];

  $("barwrap").hidden = false;
  for (let index = 0; index < take.length; index += 1) {
    const file = take[index];
    try {
      const text = await file.text();
      if (looksLikeRoast(text)) {
        files.push({ name: file.name, text, modified: file.lastModified / 1000, size: file.size });
      } else if (looksLikeCompanion(text, file.size)) {
        others.push({ name: file.name, text });
      } else {
        notRoasts.push(file.name);
      }
    } catch (error) {
      notRoasts.push(file.name);
    }
    const total = chosen - alreadyHad;
    $("bar").style.width =
      Math.round(((total - queue.length - (take.length - index - 1)) / Math.max(1, total)) * 100)
      + "%";
  }

  if (queue.length) {
    describe(queue.length + " to go");
  } else {
    $("barwrap").hidden = true;
    describe("sent");
  }
  send({ action: "files", files, others, remaining: queue.length, notRoasts });
  working = false;
}

function accept(list) {
  const all = [...list].filter(wanted);
  chosen = all.length;
  queue = all.filter(isNew);
  alreadyHad = chosen - queue.length;

  if (!chosen) {
    describe("nothing here looks like a RoasTime file", true);
    return;
  }
  if (!queue.length) {
    $("barwrap").hidden = true;
    describe("nothing new to add");
    send({ action: "none", chosen, alreadyHad });
    return;
  }
  describe(queue.length + " new — reading");
  pump();
}

/* --- the ways in --- */
$("pickFolder").onclick = () => { blockedHint = true; $("folderInput").click(); };
$("pickFiles").onclick = () => { blockedHint = false; $("fileInput").click(); };

$("folderInput").onchange = (event) => {
  if (!event.target.files.length) {
    // Chrome hands back nothing both when the dialog is cancelled and when it
    // refuses the folder outright. Say so rather than looking broken.
    describe("no files came back — if Chrome said the folder contains system " +
             "files, use <b>Choose files…</b> instead", true);
    send({ action: "folder-empty" });
    return;
  }
  accept(event.target.files);
};
$("fileInput").onchange = (event) => accept(event.target.files);

["dragenter", "dragover"].forEach((name) =>
  $("drop").addEventListener(name, (event) => {
    event.preventDefault();
    event.stopPropagation();
    $("drop").classList.add("over");
  }));
["dragleave", "dragend"].forEach((name) =>
  $("drop").addEventListener(name, () => $("drop").classList.remove("over")));

$("drop").addEventListener("drop", async (event) => {
  event.preventDefault();
  event.stopPropagation();
  $("drop").classList.remove("over");
  describe("");
  $("note").textContent = "Opening what you dropped…";

  const items = event.dataTransfer.items;
  const entries = [];
  if (items && items.length && items[0].webkitGetAsEntry) {
    for (const item of items) {
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if (entry) entries.push(entry);
    }
  }
  if (!entries.length) {                      // no entry API: plain files, still fine
    accept(event.dataTransfer.files);
    return;
  }
  const found = [];
  for (const entry of entries) await walk(entry, found, 0);
  accept(found);
});

/* the page itself must not open the file when a drop misses the target */
["dragover", "drop"].forEach((name) =>
  window.addEventListener(name, (event) => event.preventDefault()));

height();
setTimeout(height, 200);
</script>
</body>
</html>
